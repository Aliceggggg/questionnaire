<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание опроса</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .question-block {
            border: 1px solid #ccc;
            margin-bottom: 15px;
            padding: 10px;
        }
        .option { margin-bottom: 5px; }
        .option button {
            margin-left: 10px;
            padding: 2px 6px;
            font-size: 0.9em;
        }
        .group-selection {
            border: 1px solid #ccc; 
            padding: 10px; 
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Создание нового опроса</h1>
    <form method="POST">
        <div>
            <label for="title">Название опроса:</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <!-- Блок выбора групп -->
        <div class="group-selection">
            <h2>Кому доступно прохождение опроса</h2>
            {% if groups %}
                {% for group in groups %}
                    <div>
                        <input type="checkbox" id="group_{{ group.id }}" name="survey_groups" value="{{ group.id }}">
                        <label for="group_{{ group.id }}">{{ group.name }}</label>
                    </div>
                {% endfor %}
            {% else %}
                <p>Нет доступных групп.</p>
            {% endif %}
        </div>
        
        <!-- Блок создания вопросов -->
        <div id="questions_container">
            <!-- Здесь будут добавляться блоки вопросов -->
        </div>
        <button type="button" onclick="addQuestion()">Добавить вопрос</button>
        <br><br>
        <input type="submit" value="Создать опрос">
    </form>

    <!-- Шаблон блока вопроса -->
    <template id="question_template">
        <div class="question-block" data-index="__index__">
            <h3>Вопрос __number__</h3>
            <div>
                <label>Текст вопроса:</label>
                <input type="text" name="questions[__index__][text]" required>
            </div>
            <div>
                <input type="checkbox" name="questions[__index__][allow_comments]" value="1">
                <label>Разрешить комментарии</label>
            </div>
            <div>
                <input type="checkbox" name="questions[__index__][multiple_selection]" value="1">
                <label>Разрешить выбор нескольких ответов</label>
            </div>
            <div class="options">
                <label>Варианты ответа:</label>
                <div class="option">
                    <input type="text" name="questions[__index__][options][]" placeholder="Вариант 1" required>
                    <button type="button" onclick="removeOption(this)">Удалить вариант</button>
                </div>
                <div class="option">
                    <input type="text" name="questions[__index__][options][]" placeholder="Вариант 2" required>
                    <button type="button" onclick="removeOption(this)">Удалить вариант</button>
                </div>
            </div>
            <button type="button" onclick="addOption(this)">Добавить вариант ответа</button>
            <button type="button" onclick="removeQuestion(this)">Удалить вопрос</button>
        </div>
    </template>
    <script>
        let questionCount = 0;
    
        // Добавление нового вопроса
        function addQuestion() {
            const template = document.getElementById("question_template").innerHTML;
            // Заменяем маркеры __index__ и __number__
            const newHtml = template.replace(/__index__/g, questionCount).replace(/__number__/g, questionCount + 1);
            const container = document.getElementById("questions_container");
            const wrapper = document.createElement("div");
            wrapper.innerHTML = newHtml;
            // Устанавливаем data-атрибут для идентификации вопроса
            wrapper.firstElementChild.setAttribute("data-index", questionCount);
            container.appendChild(wrapper.firstElementChild);
            questionCount++;
            updateQuestionNumbers(); // Обновляем нумерацию вопросов и их полей
        }
    
        // Добавление нового варианта ответа к конкретному вопросу
        function addOption(button) {
            const questionBlock = button.closest(".question-block");
            const optionsDiv = questionBlock.querySelector(".options");
            const newOptionDiv = document.createElement("div");
            newOptionDiv.className = "option";
            newOptionDiv.innerHTML = `
                <input type="text" placeholder="Вариант" required>
                <button type="button" onclick="removeOption(this)">Удалить вариант</button>
            `;
            optionsDiv.appendChild(newOptionDiv);
            updateOptionNumbers(questionBlock);
        }
    
        // Удаление вопроса
        function removeQuestion(button) {
            const questionBlock = button.closest(".question-block");
            questionBlock.remove();
            updateQuestionNumbers();
        }
    
        // Удаление варианта ответа (минимум должен оставаться 1)
        function removeOption(button) {
            const optionDiv = button.closest(".option");
            const optionsDiv = optionDiv.parentNode;
            const questionBlock = button.closest(".question-block");
            if (optionsDiv.querySelectorAll(".option").length > 1) {
                optionDiv.remove();
                updateOptionNumbers(questionBlock);
            } else {
                alert("Должно быть минимум 1 вариант ответа.");
            }
        }
    
        // Обновляет нумерацию вариантов внутри одного вопроса:
        // - Обновляет placeholder
        // - Обновляет атрибут name, чтобы он соответствовал формату: questions[номер_вопроса][options][]
        function updateOptionNumbers(questionBlock) {
            const optionsDiv = questionBlock.querySelector(".options");
            const optionElements = optionsDiv.querySelectorAll(".option");
            const qIndex = questionBlock.getAttribute("data-index");
            optionElements.forEach((optionElement, idx) => {
                const input = optionElement.querySelector("input[type='text']");
                input.placeholder = 'Вариант ' + (idx + 1);
                // Обновляем name, чтобы сервер получил корректное имя поля
                input.name = `questions[${qIndex}][options][]`;
            });
        }
    
        // Обновляет нумерацию для всех вопросов и внутри каждого вопроса: 
        // - Обновляет data-index, заголовки (h3)
        // - Обновляет атрибуты name для полей текста вопроса и опций
        function updateQuestionNumbers() {
            const questionBlocks = document.querySelectorAll(".question-block");
            questionBlocks.forEach((block, qIndex) => {
                block.setAttribute("data-index", qIndex);
                // Обновляем заголовок с номером вопроса
                const header = block.querySelector("h3");
                if (header) {
                    header.innerText = `Вопрос ${qIndex + 1}`;
                }
                // Обновляем name для поля текста вопроса (если имеется)
                let textInput = block.querySelector("input[name^='questions'][name$='[text]']");
                if (textInput) {
                    textInput.name = `questions[${qIndex}][text]`;
                }
                // Аналогично обновляем name для checkbox-полей (если они есть)
                let allowComments = block.querySelector("input[name^='questions'][name*='[allow_comments]']");
                if (allowComments) {
                    allowComments.name = `questions[${qIndex}][allow_comments]`;
                }
                let multipleSelection = block.querySelector("input[name^='questions'][name*='[multiple_selection]']");
                if (multipleSelection) {
                    multipleSelection.name = `questions[${qIndex}][multiple_selection]`;
                }
                // Обновляем нумерацию вариантов для этого вопроса
                updateOptionNumbers(block);
            });
            // Обновляем глобальный счетчик вопросов
            questionCount = questionBlocks.length;
        }
    </script>    
</body>
</html>
